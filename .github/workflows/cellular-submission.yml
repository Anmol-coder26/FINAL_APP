name: Cellular transcription submission build
on:
  push:
    branches: [feat/cellular-live-transcription]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build microphone-listening APK (Android recognition fallback)
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SuSagi-speakerphone-assist-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify transcript accumulation
        run: gradle :app:testDebugUnitTest --tests com.guardian.app.LiveTranscriptBufferTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcription-test-results
          path: app/build/reports/tests/testDebugUnitTest/
