name: Cellular transcription submission build
on:
  push:
    branches: [feat/cellular-live-transcription]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build microphone-listening APK (Android recognition fallback)
        run: gradle :app:assembleDebug -PsubmissionDemo=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SuSagi-Demo-separate-install
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run all existing and new unit tests
        run: gradle :app:testDebugUnitTest -PsubmissionDemo=true --stacktrace
      - name: Check configured app build keeps original package
        run: gradle :app:processDebugMainManifest -PsubmissionDemo=false --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcription-test-results
          path: app/build/reports/tests/testDebugUnitTest/
