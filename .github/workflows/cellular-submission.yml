name: Cellular transcription submission build
on:
  push:
    branches: [feat/cellular-live-transcription]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;34.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keep demo update signing consistent across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: susagi-demo-debug-keystore-v1
      - name: Build microphone-listening APK (Android recognition fallback)
        run: gradle :app:assembleDebug -PsubmissionDemo=true --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SuSagi-Demo-separate-install
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run all existing and new unit tests
        run: gradle :app:testDebugUnitTest -PsubmissionDemo=true --stacktrace
      - name: Check configured app build keeps original package
        run: gradle :app:processDebugMainManifest -PsubmissionDemo=false --stacktrace
      - name: Enable hardware acceleration for Android launch check
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install and launch the actual APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android_launch_smoke.py
      - name: Publish a directly downloadable demo APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SuSagi-Demo.apk
          sha256sum dist/SuSagi-Demo.apk > dist/SHA256SUMS.txt
          gh release create "susagi-demo-${GITHUB_RUN_NUMBER}" dist/SuSagi-Demo.apk dist/SHA256SUMS.txt --prerelease --latest=false --target "$GITHUB_SHA" --title "SuSagi Demo ${GITHUB_RUN_NUMBER}" --notes-file docs/DEMO_DOWNLOAD.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-launch-check
          path: app/build/reports/android-launch/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcription-test-results
          path: app/build/reports/tests/testDebugUnitTest/
